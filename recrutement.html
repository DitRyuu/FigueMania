<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recrutement | FIGUEMANIA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <header>
    <h1>Rejoins la fédération !</h1>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="collection.html">Collection</a></li>
        <li><a href="roster.html">Roster</a></li>
        <li><a href="recrutement.html" class="active">Recrutement</a></li>
        <li><a href="resultats.html">Résultats</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="form-container">
      <h2>Formulaire de candidature</h2>
      <p>Remplis le formulaire ci-dessous pour rejoindre la Fédération. Nos recruteurs te contacteront si ton profil correspond.</p>

      <form action="https://formsubmit.co/TON_EMAIL_ICI" method="POST">
        <!-- Sécurité & configuration -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://tonsite.com/merci.html">

        <label for="nom">Nom de scène</label>
        <input type="text" id="nom" name="Nom de scène" placeholder="Ex : Thunder Blaze" required>

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="Email" placeholder="exemple@mail.com" required>

        <label for="style">Style de combat</label>
        <input type="text" id="style" name="Style de combat" placeholder="Ex : Aérien, Puissant, Technique..." required>

        <label for="description">Décris ton personnage</label>
        <textarea id="description" name="Description du personnage" rows="4" placeholder="Décris ton look, ton histoire, ton attitude..." required></textarea>

        <label for="motivation">Pourquoi veux-tu rejoindre la fédération ?</label>
        <textarea id="motivation" name="Motivation" rows="3" placeholder="Explique ta motivation ici..." required></textarea>

        <button type="submit">Envoyer ma candidature</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Catch Universe</p>
  </footer>
</body>
</html>
