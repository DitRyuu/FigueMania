<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Résultats - FigueMania</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at center, #140014 0%, #000010 100%);
      color: white;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 20px 0;
      font-size: 2em;
      color: #ff73ff;
      text-shadow: 0 0 10px #ff73ff, 0 0 20px #c700ff;
    }

    /* Conteneur du diaporama */
    .slideshow-container {
      position: relative;
      max-width: 90%;
      margin: 40px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px #c700ff;
    }

    /* Images du diaporama */
    .slide {
      display: none;
      width: 100%;
      height: 550px;
      object-fit: cover;
      border-radius: 12px;
      animation: fade 2s;
    }

    /* Animation fondu entre les images */
    @keyframes fade {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
